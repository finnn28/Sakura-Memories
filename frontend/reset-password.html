
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pemulihan akun Sakura Memories.">
  <title>Reset Password | Sakura Memories</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="sakura-petals" aria-hidden="true"></div>

  <main class="login-page">
    <section class="login-card" aria-labelledby="page-title">

      <a class="brand" href="index.html">
        <span class="brand-icon" aria-hidden="true">絆</span>
        <span class="brand-name">SAKURA <span>MEMORIES</span></span>
      </a>

      <div class="login-heading">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1 id="page-title">Reset Password</h1>
        <p class="subtitle">
          Masukkan email akunmu untuk memulai proses pemulihan password.
        </p>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label for="email">Email Terdaftar</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nama@email.com"
            autocomplete="email"
            required
          >
        </div>

        <button type="submit" class="login-button">
          <span>Kirim Instruksi</span>
          <span aria-hidden="true">↗</span>
        </button>

        <p id="form-message" class="form-message" role="status"></p>
      </form>

      <div class="divider">
        <span>INGAT PASSWORD?</span>
      </div>

      <p class="register-text">
        <a href="index.html" class="text-link">Kembali ke Login</a>
      </p>

      
    </section>
  </main>
</body>
</html>
