
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Halaman demo API Sakura Memories">
  <title>API Demo | Sakura Memories</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a href="index.html" class="brand">
      Sakura Memories
    </a>

    <h1 class="login-heading">Demo Profil Anggota</h1>
    <p>Halaman latihan komunikasi frontend dan backend.</p>

    <form id="demo-profile-form">
      <div class="form-group">
        <label for="demo-ign">IGN Toram Online</label>
        <input
          id="demo-ign"
          name="ign"
          type="text"
          minlength="3"
          maxlength="20"
          required
          autocomplete="off"
          placeholder="Contoh: SakuraMage"
        >
      </div>

      <div class="form-group">
        <label for="demo-introduction">Perkenalan</label>
        <textarea
          id="demo-introduction"
          name="introduction"
          minlength="5"
          maxlength="200"
          required
          placeholder="Ceritakan sedikit tentang karaktermu."
        ></textarea>
      </div>

      <button type="submit" class="login-button">
        Kirim Data Demo
      </button>

      <p
        id="demo-message"
        class="form-message"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
    </form>

    <p class="footer-note">
      Data demo tidak disimpan ke database.
    </p>
  </main>
</body>
</html>
