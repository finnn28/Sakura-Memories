
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Sakura Memories</title>
  <meta
    name="description"
    content="Masuk ke Sakura Memories, portal komunitas Toram Online."
  >

  <link rel="stylesheet" href="style.css">

  <!-- 1. Memuat library Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
  ></script>

  <!-- 2. Membuat koneksi Supabase -->
  <script src="supabase-client.js" defer></script>

  <!-- 3. Menjalankan logika halaman -->
  <script src="script.js" defer></script>
</head>
<body>
  <div class="sakura-petals" aria-hidden="true"></div>

  <main class="login-page">
    <section class="login-card" aria-labelledby="page-title">

      <a class="brand" href="#" aria-label="Sakura Memories">
        <span class="brand-icon" aria-hidden="true">絆</span>
        <span class="brand-name">SAKURA <span>MEMORIES</span></span>
      </a>

      <div class="login-heading">
        <p class="eyebrow">WELCOME ADVENTURER!</p>
        <p class="subtitle">
          Login kembali dan lanjutkan petualanganmu.
        </p>
      </div>

      <p
        id="api-status"
        class="api-status"
        role="status"
        aria-live="polite"
>
        Memeriksa koneksi server...
      </p>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email atau Username</label>
          <input
            type="text"
            id="email"
            name="email"
            placeholder="Masukkan email atau username"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="toggle-password"
              class="toggle-password"
              aria-label="Tampilkan password"
              aria-pressed="false"
            >
              Lihat
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-option">
            <input type="checkbox" id="remember">
            <span>Ingat saya</span>
          </label>

          <a href="reset-password.html" class="text-link" id="forgot-link">
            Lupa password?
          </a>
        </div>

        <button type="submit" class="login-button">
          <span>Login</span>
        </button>

        <p id="form-message" class="form-message" role="status"></p>
      </form>

      <div class="divider">
        <span>ATAU</span>
      </div>

      <p class="register-text">
        Belum menjadi anggota?
        <a href="register.html" class="text-link" id="register-link">
          Daftar sekarang
        </a>
      </p>
    </section>
  </main>
</body>
</html>
