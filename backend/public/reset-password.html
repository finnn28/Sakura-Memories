
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pemulihan akun Sakura Memories.">
  <title>Reset Password | Sakura Memories</title>
  <link rel="stylesheet" href="style.css">
  <script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  defer
></script>
<script src="supabase-client.js" defer></script>
<script src="script.js" defer></script>
</head>
<body>
  <div class="sakura-petals" aria-hidden="true"></div>

  <main class="login-page">
    <section class="login-card" aria-labelledby="page-title">

      <a class="brand" href="index.html">
        <span class="brand-name">絆SAKURA MEMORIES</span>
      </a>

      <div class="login-heading">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1 id="page-title">Reset Password</h1>
        <p class="subtitle">
          Masukkan email akunmu untuk memulai proses pemulihan password.
        </p>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label for="email">Email Terdaftar</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nama@email.com"
            autocomplete="email"
            required
          >
        </div>

        <button type="submit" class="login-button">
          <span>Kirim Instruksi</span>
          <span aria-hidden="true">↗</span>
        </button>

        <p id="form-message" class="form-message" role="status"></p>
      </form>

      <form id="reset-new-password-form" hidden>
  <div class="form-group">
    <label for="new-password">Password Baru</label>
    <input
      type="password"
      id="new-password"
      name="new-password"
      autocomplete="new-password"
      minlength="8"
      required
    >
  </div>

  <div class="form-group">
    <label for="confirm-new-password">
      Konfirmasi Password Baru
    </label>
    <input
      type="password"
      id="confirm-new-password"
      name="confirm-new-password"
      autocomplete="new-password"
      minlength="8"
      required
    >
  </div>

  <button type="submit" class="login-button">
    <span>Simpan Password Baru</span>
    <span aria-hidden="true">↗</span>
  </button>
</form>

      <div class="divider">
        <span>INGAT PASSWORD?</span>
      </div>

      <p class="register-text">
        <a href="index.html" class="text-link">Kembali ke Login</a>
      </p>

      
    </section>
  </main>
</body>
</html>
