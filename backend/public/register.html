
<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buat akun Sakura Memories.">
  <title>Registrasi | Sakura Memories</title>

  <link rel="stylesheet" href="style.css">

  <!-- 1. Memuat library Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
  ></script>

  <!-- 2. Membuat koneksi Supabase -->
  <script src="supabase-client.js" defer></script>

  <!-- 3. Menjalankan logika halaman -->
  <script src="script.js" defer></script>
</head>

<body>
  <div class="sakura-petals" aria-hidden="true"></div>

  <main class="login-page">
    <section class="login-card" aria-labelledby="page-title">

      <a class="brand" href="index.html">
        <span class="brand-name">絆SAKURA MEMORIES</span>
      </a>

      <div class="login-heading">
        <p class="eyebrow">JOIN OUR COMMUNITY</p>
        <h1 id="page-title">Create Account</h1>
        <p class="subtitle">
          Mulai perjalananmu bersama komunitas Sakura Memories.
        </p>
      </div>

      <form id="register-form">
        
      <div class="form-group">
        <label for="username">Username</label>
         <input
          type="text"
          id="username"
        name="username"
        placeholder="Masukkan Username"
        minlength="3"
        maxlength="30"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
  >
      </div>


        <div class="form-group">
          <label for="invite-code">Kode Undangan Guild</label>
          <input
            type="password"
            id="invite-code"
            name="invite-code"
            placeholder="Masukkan kode undangan"
            autocomplete="off"
            required
          >
        </div>



        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nama@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimal 8 karakter"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>


<div class="password-strength" id="password-strength" hidden>
  <div class="password-strength-header">
    <span>Kekuatan password</span>
    <span
      class="password-strength-label"
      id="password-strength-label"
    >
      -
    </span>
  </div>

  <div
    class="password-strength-track"
    role="progressbar"
    aria-label="Kekuatan password"
    aria-valuemin="0"
    aria-valuemax="4"
    aria-valuenow="0"
    id="password-strength-track"
  >
    <div class="password-strength-bar" id="password-strength-bar"></div>
  </div>

  <p class="password-strength-hint" id="password-strength-hint">
    Gunakan password yang panjang dan sulit ditebak.
  </p>
</div>


        <div class="form-group">
          <label for="confirm-password">Konfirmasi Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Masukkan ulang password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" class="login-button">
          <span>Buat Akun</span>
          <span aria-hidden="true">↗</span>
        </button>

        <p id="form-message" class="form-message" role="status"></p>
      </form>

      <div class="divider">
        <span>SUDAH PUNYA AKUN?</span>
      </div>

      <p class="register-text">
        <a href="index.html" class="text-link">Kembali ke Login</a>
      </p>

      
    </section>
  </main>
</body>
</html>
